  function toggleThemeMenu(e) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }
    const dropdown = document.getElementById("themeDropdown");
    if (dropdown) dropdown.classList.toggle("show");
  }

    /* ==========================================================================
     1. Themes & Backdrop Engine (With Persistence)
     ========================================================================== */
  function switchTheme(index) {
    const themeNames = [
      "Space Rocket Explorer", "TalkStars Treehouse", "Dino Volcano Jungle",
      "Cyber Racing Grid", "Stadium Sports Arena", "Unicorn Dreamland",
      "Princess Fairy Garden", "Candy Bubble Carnival"
    ];
    const card = document.getElementById("appScreen");
     
    if (typeof window.posthog?.capture === 'function') {
      posthog.capture('Theme Changed', {
        theme_index: index,
        theme_name: themeNames[index] || "Unknown"
      });
    }

    if (card && backdrops[index]) {
      card.style.backgroundImage = `url('${backdrops[index]}')`;
      // 💾 Save selected preset theme index
      localStorage.setItem('talkstars_saved_theme_type', 'preset');
      localStorage.setItem('talkstars_saved_theme_index', index.toString());
    }
    document.getElementById("themeDropdown").classList.remove("show");
  }

  function handleCustomUpload(event) {
  const file = event.target.files?.[0];
  if (!file) return;

  const img = new Image();
  img.onload = function () {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    
    // Downscale for performance
    const maxDimension = 1200;
    let { width, height } = img;
    if (width > height && width > maxDimension) {
      height = Math.round((height * maxDimension) / width);
      width = maxDimension;
    } else if (height > maxDimension) {
      width = Math.round((width * maxDimension) / height);
      height = maxDimension;
    }

    canvas.width = width;
    canvas.height = height;
    ctx.drawImage(img, 0, 0, width, height);

    // Compress as JPEG at 75% quality (~100-200 KB)
    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.75);

    const card = document.getElementById("appScreen");
    if (card) card.style.backgroundImage = `url('${compressedDataUrl}')`;

    try {
      localStorage.setItem('talkstars_saved_theme_type', 'custom');
      localStorage.setItem('talkstars_saved_custom_bg', compressedDataUrl);
    } catch (err) {
      console.warn("Storage quota exceeded", err);
    }
  };

  img.src = URL.createObjectURL(file);
  document.getElementById("themeDropdown")?.classList.remove("show");
}

  /* ==========================================================================
     2. Doodles Engine (With Persistence)
     ========================================================================== */
  let doodlesActive = false;
  const doodleEmojis = ["⭐", "🚀", "🦄", "🐼", "🌈", "🍦", "🎈", "🫧"];

  function toggleDoodles(isEnabled) {
    doodlesActive = isEnabled;
    const container = document.getElementById("doodlesContainer");
    const checkbox = document.getElementById("doodleCheckbox");

    if (checkbox) checkbox.checked = doodlesActive;

    if (container) {
      container.style.display = doodlesActive ? "block" : "none";
      if (doodlesActive) renderDoodles();
    }

    // 💾 Save doodle checkbox state
    localStorage.setItem('talkstars_doodles_active', doodlesActive ? 'true' : 'false');
  }

  function renderDoodles() {
    const container = document.getElementById("doodlesContainer");
    if (!container) return;
    container.innerHTML = "";

    const totalDoodles = 8;
    for (let i = 0; i < totalDoodles; i++) {
      const emoji = doodleEmojis[i % doodleEmojis.length];
      const doodleEl = document.createElement("div");
      doodleEl.className = "doodle";
      doodleEl.innerText = emoji;

      const leftPos = (i * (100 / totalDoodles)) + (Math.random() * 4 - 2);
      const duration = (9 + Math.random() * 6).toFixed(1);
      const delay = (Math.random() * 4).toFixed(1);

      doodleEl.style.left = `${Math.max(3, Math.min(92, leftPos))}%`;
      doodleEl.style.animationDuration = `${duration}s`;
      doodleEl.style.animationDelay = `${delay}s`;

      container.appendChild(doodleEl);
    }
  }

    const nameInput = document.getElementById("kidNameInput");

    const subtitle = document.getElementById("mainSubtitle");

    // 1. Update UI Headings
    if (rawName) {
      title.innerText = `${rawName.toUpperCase()}`;
      subtitle.innerText = `Tell Your Story & Earn 5 Stars! ⭐`;
      localStorage.setItem("talkstars_saved_name", rawName); // 💾 Save name for future visits
    } else {
      title.innerText = "TALK STARS";
      subtitle.innerText = "Tell Your Story & Earn 5 Stars! ⭐";
      localStorage.removeItem("talkstars_saved_name"); // Clear if the input is deleted
    }

    // 2. Debounce PostHog analytics update (500ms)
    clearTimeout(nameDebounceTimer);
    nameDebounceTimer = setTimeout(() => {
      if (rawName && typeof window.posthog?.capture === 'function') {
        posthog.people.set({ name: rawName });
        posthog.capture('Name Added', { kid_name: rawName });
      }
    }, 500);
  }

    const savedName = localStorage.getItem("talkstars_saved_name");
    const nameInput = document.getElementById("kidNameInput");

      updatePersonalization(); // Refreshes hero title, subtitle & PostHog

  }

    const currentAge = document.getElementById("ageGroup")?.value || "Unknown";
    const speakerName = document.getElementById("kidNameInput")?.value.trim() || "Anonymous";

    if (typeof window.posthog?.capture === 'function') {
      window.posthog.capture('Topic Feedback Submitted', {
        feedback_rating: rating,
        topic: currentTopic,
        age_group: currentAge,
        speaker_name: speakerName
      });
    }

    const optionsRow = document.querySelector(".feedback-options-row");
    const thanksMsg = document.getElementById("feedbackThanks");
    if (optionsRow) optionsRow.style.display = "none";
    if (thanksMsg) thanksMsg.style.display = "block";
  }

  async function generateTopic(mode = 'topic') {
    const ageGroup = document.getElementById("ageGroup").value;
    const genBtn = document.getElementById("genBtn");
    const wordBtn = document.getElementById("wordBtn");
    const wordDisplay = document.getElementById("wordDisplay");
    
    // UI Loading state
    if (genBtn) genBtn.innerText = "⏳ Mixing Ideas...";
    if (wordBtn) wordBtn.disabled = true;

    try {
      const response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ageGroup, mode })
      });

      if (!response.ok) throw new Error("API limit or failure");

      const data = await response.json();
      renderResult(data.main, data.extra);

      if (typeof window.posthog?.capture === 'function') {
        posthog.capture('Prompt Generated', { mode, ageGroup });
      }
    } catch (err) {
      // Fallback offline banks if API is busy
      const fallbackTopics = mode === 'word' 
        ? { main: "Rocket", extra: ["Space", "Stars"] }
        : { main: "My Favorite Adventure in the Park", extra: ["Slide", "Puppy", "Tree"] };
      
      renderResult(fallbackTopics.main, fallbackTopics.extra);
    } finally {
      if (genBtn) genBtn.innerText = "🎲 Pick Another Topic";
      if (wordBtn) wordBtn.disabled = false;
    }
  }

    function renderResult(mainWord, extraWords) {
    const promptCard = document.getElementById("promptCard");
    const wordDisplay = document.getElementById("wordDisplay");
    const bonusCard = document.getElementById("bonusCard");
    const adjoiningContainer = document.getElementById("adjoiningDisplay");
    const genBtn = document.getElementById("genBtn");

    if (wordDisplay) wordDisplay.innerText = mainWord;
    if (promptCard) promptCard.style.display = "flex";
    if (genBtn) genBtn.innerText = "🎲 Pick Another Topic!";

    currentExtraWords = extraWords || [];
    adjoiningContainer.innerHTML = "";

    if (currentExtraWords.length > 0) {
      currentExtraWords.forEach(word => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.innerText = word;
        adjoiningContainer.appendChild(chip);
      });
      if (bonusCard) bonusCard.style.display = "block";
    } else {
      if (bonusCard) bonusCard.style.display = "none";
    }
  }

  /* ==========================================================================
     5. Recorder & Timer Control
     ========================================================================== */
  let totalDuration = 60;
  let timeLeft = 60;
  let timerInterval = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let speechRecognizer = null;
  let speechTextAccumulator = "";
  let speechSecondsSpoken = 0;
  let audioStream = null;

  function changeDuration() {
    totalDuration = parseInt(document.getElementById("talkDuration").value, 10);
    resetTimer();
  }

  function updateTimerDisplay() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;
    document.getElementById("timer").innerText = 
      `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
  }
// Global audio storage
let audioBlob = null;
  async function startChallenge() {
    speechTextAccumulator = "";
    speechSecondsSpoken = 0;
    audioChunks = [];

    if (typeof window.posthog?.capture === 'function') {
      posthog.capture('Recording Started', {
        duration_setting: document.getElementById("talkDuration").value,
        age_group: document.getElementById("ageGroup").value,
        topic: document.getElementById("wordDisplay")?.innerText
      });
    }

    try {
      audioStream = await navigator.mediaDevices.getUserMedia({ 
        audio: { echoCancellation: true, noiseSuppression: true } 
      });

      const mimeTypes = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/aac'];
      const supportedMime = mimeTypes.find(type => MediaRecorder.isTypeSupported(type)) || '';
      
      mediaRecorder = supportedMime ? new MediaRecorder(audioStream, { mimeType: supportedMime }) : new MediaRecorder(audioStream);

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) audioChunks.push(e.data);
      };
      

mediaRecorder.onstop = () => {
  const mime = audioChunks[0]?.type || 'audio/mp4';
  audioBlob = new Blob(audioChunks, { type: mime }); // 👈 Removed 'const' to assign globally
  const audioUrl = URL.createObjectURL(audioBlob);
  const player = document.getElementById("audioPlayback");
  if (player) {
    player.src = audioUrl;
    player.load();
  }
};

      mediaRecorder.start(250);

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        try {
          speechRecognizer = new SpeechRecognition();
          speechRecognizer.continuous = true;
          speechRecognizer.interimResults = true;
          speechRecognizer.lang = 'en-US';

          speechRecognizer.onresult = (event) => {
            let fullCurrent = "";
            for (let i = 0; i < event.results.length; ++i) {
              fullCurrent += event.results[i][0].transcript + " ";
            }
            speechTextAccumulator = fullCurrent.trim();
          };

          speechRecognizer.start();
        } catch (e) {}
      }

      document.getElementById("recordingStatus").style.display = "flex";
      document.getElementById("timerBtn").style.display = "none";
      document.getElementById("finishBtn").style.display = "inline-block";
      document.getElementById("talkDuration").disabled = true;

      timerInterval = setInterval(() => {
        speechSecondsSpoken++;
        if (timeLeft > 0) {
          timeLeft--;
          updateTimerDisplay();
        } else {
          finishTalk();
        }
      }, 1000);

    } catch (err) {
      alert("Please allow microphone access to record your voice!");
    }
    completeOnboardingPermanently();
  }

  function finishTalk() {
    clearInterval(timerInterval);
    timerInterval = null;

    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
    if (audioStream) audioStream.getTracks().forEach(track => track.stop());
    if (speechRecognizer) {
      try { speechRecognizer.stop(); } catch (e) {}
    }

    document.getElementById("recordingStatus").style.display = "none";
    document.getElementById("timerBtn").style.display = "inline-block";
    document.getElementById("finishBtn").style.display = "none";
    document.getElementById("talkDuration").disabled = false;

    setTimeout(() => {
      evaluateSpeech();
      resetTimer();
    }, 400);
  }

  function downloadRecording() {
    const player = document.getElementById("audioPlayback");
    if (!player || !player.src) return;

    const kidName = document.getElementById("kidNameInput")?.value.trim() || "TalkStar";
    const fileName = `${kidName}-speech.mp4`;

    const a = document.createElement("a");
    a.href = player.src;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    if (typeof window.posthog?.capture === 'function') {
      posthog.capture('Recording Downloaded', {
        speaker_name: kidName,
        speaking_time_seconds: speechSecondsSpoken,
        topic: document.getElementById("wordDisplay")?.innerText
      });
    }
  }

    /* ==========================================================================
     Share Recording Handler (Web Share API + WhatsApp Fallback)
     ========================================================================== */

async function shareRecording() {
  const savedName = (localStorage.getItem("talkstars_saved_name") || "TalkStars").trim();
  const topicElem = document.getElementById("wordDisplay");
  const currentTopic = topicElem ? topicElem.innerText : "a fun topic";
  const shareText = `🎙️ Listen to ${savedName}'s speech on "${currentTopic}" on TalkStars! ⭐\nhttps://talkstars.vercel.app/`;

  if (typeof window.posthog?.capture === 'function') {
    posthog.capture('Recording Share Clicked', { speaker: savedName });
  }

  // 1. Attempt Native Audio File Share (Mobile OS)
  if (audioBlob && navigator.canShare) {
    try {
      // Determine clean extension based on actual blob type
      const isMp4 = audioBlob.type.includes('mp4') || audioBlob.type.includes('m4a');
      const ext = isMp4 ? 'm4a' : 'webm';
      const cleanMime = isMp4 ? 'audio/mp4' : 'audio/webm';
      const fileName = `${savedName.replace(/[^a-zA-Z0-9]/g, '_')}_speech.${ext}`;

      const audioFile = new File([audioBlob], fileName, { type: cleanMime });

      // Check if the OS specifically accepts this audio file
      if (navigator.canShare({ files: [audioFile] })) {
        // IMPORTANT: Send ONLY the file (do not mix text/url in the same call)
        await navigator.share({
          files: [audioFile],
          title: `${savedName}'s Speech`
        });
        return;
      }
    } catch (err) {
      if (err.name === 'AbortError') return; // User simply closed the share sheet
      console.warn('File share not permitted by browser, falling back to text share...', err);
    }
  }

  // 2. Fallback: Native Text/Link Share
  if (navigator.share) {
    try {
      await navigator.share({
        title: 'TalkStars Speech Recording',
        text: shareText
      });
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
      console.warn('Native text share failed, falling back to direct link...', err);
    }
  }

  // 3. Desktop / Non-Supported Fallback: Direct WhatsApp Web
  const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;
  window.open(whatsappUrl, '_blank');
}

  function evaluateSpeech() {
    const transcript = speechTextAccumulator.trim();
    const summaryBox = document.getElementById("summaryDisplay");
    const kidName = document.getElementById("kidNameInput")?.value.trim();
    const speakerLabel = kidName ? `${kidName}` : "Speaker";
    const topic = document.getElementById("wordDisplay")?.innerText || "Your Topic";

    if (typeof window.posthog?.capture === 'function') {
      posthog.capture('Speech Evaluated', {
        topic: topic,
        duration_spoken_seconds: speechSecondsSpoken,
        word_count: transcript ? transcript.split(/\s+/).filter(w => w.length > 0).length : 0,
        stars_awarded: (speechSecondsSpoken >= 45) ? 5 : (speechSecondsSpoken >= 15) ? 4 : 3
      });
    }
    
    let stars = "⭐⭐⭐";
    let feedback = `Good effort ${speakerLabel}! Keep talking to share more details!`;

    const words = transcript ? transcript.split(/\s+/).filter(w => w.length > 0) : [];
    const wordCount = words.length;

    if (speechSecondsSpoken >= 45 || wordCount >= 30) {
      stars = "⭐⭐⭐⭐⭐";
      feedback = `🏆 Outstanding job, ${speakerLabel}! You are a true TalkStar!`;
    } else if (speechSecondsSpoken >= 15 || wordCount >= 12) {
      stars = "⭐⭐⭐⭐";
      feedback = `🎉 Awesome talk, ${speakerLabel}! Great voice and pacing!`;
    }

    let bonusHitText = "Spoke with great confidence";
    if (transcript && currentExtraWords.length > 0) {
      const lower = transcript.toLowerCase();
      const hits = currentExtraWords.filter(w => lower.includes(w.toLowerCase()));
      if (hits.length > 0) {
        bonusHitText = `Included <strong>${hits.join(", ")}</strong>`;
      }
    }

    if (summaryBox) {
      summaryBox.innerHTML = `
        <div style="font-size: 0.88rem; line-height: 1.6;">
          • 🎯 <strong>Topic:</strong> ${topic}<br>
          • ⏱️ <strong>Speaking Time:</strong> ${speechSecondsSpoken}s recorded<br>
          • ⭐ <strong>Bonus Words:</strong> ${bonusHitText}<br>
          • 🎙️ <strong>Voice Playback:</strong> Ready to listen above!
        </div>
      `;
    }

    document.getElementById("starsDisplay").innerText = stars;
    document.getElementById("ratingFeedback").innerText = feedback;
    document.getElementById("resultModal").style.display = "flex";

    completeOnboardingPermanently();
  } 

  function closeModal() {
    document.getElementById("resultModal").style.display = "none";
    const audio = document.getElementById("audioPlayback");
    if (audio) {
      audio.pause();
      audio.currentTime = 0;
    }

    const optionsRow = document.querySelector(".feedback-options-row");
    const thanksMsg = document.getElementById("feedbackThanks");
    if (optionsRow) optionsRow.style.display = "flex";
    if (thanksMsg) thanksMsg.style.display = "none";
  }

  function resetTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    timeLeft = totalDuration;
    updateTimerDisplay();
  }

  /* ==========================================================================
     6. DOM-Anchored Onboarding Engine
     ========================================================================== */
  let currentGuideStep = 0;

  function initOnboardingGuide() {
    const hasRecorded = localStorage.getItem('talkstars_first_speech_recorded');
    if (hasRecorded === 'true') {
      const tooltip = document.getElementById('onboardingTooltip');
      if (tooltip) tooltip.remove();
      return;
    }

    currentGuideStep = 1;
    showGuideForElement('genBtn', '👇 Tap here to get a topic!');

    if (typeof window.posthog?.capture === 'function') {
      window.posthog.capture('onboarding_started');
    }
  }

  function showGuideForElement(elementId, text) {
    const target = document.getElementById(elementId);
    const tooltip = document.getElementById('onboardingTooltip');
    const guideText = document.getElementById('guideText');

    if (!target || !tooltip) return;

    guideText.innerText = text;
    
    // Anchor tooltip directly into the target button's parent container
    if (target.parentElement) {
      target.parentElement.appendChild(tooltip);
    }

    tooltip.style.display = 'inline-flex';
  }

  function advanceGuideStep(completedStep) {
    const hasRecorded = localStorage.getItem('talkstars_first_speech_recorded');
    if (hasRecorded === 'true') return;

    if (completedStep === 1 && currentGuideStep === 1) {
      currentGuideStep = 2;
      setTimeout(() => {
        showGuideForElement('timerBtn', '👇 Now tap Record & speak!');
      }, 300);
    }
  }

  function completeOnboardingPermanently() {
    currentGuideStep = 0;
    const tooltip = document.getElementById('onboardingTooltip');
    if (tooltip) tooltip.remove();

    localStorage.setItem('talkstars_first_speech_recorded', 'true');

    if (typeof window.posthog?.capture === 'function') {
      window.posthog.capture('onboarding_completed');
    }
  }

  /* ==========================================================================
     7. Live Counter Simulation & Init
     ========================================================================== */
  let baseUsers = 16;
  function updateOnlineUsers() {
    baseUsers += Math.floor(Math.random() * 3) - 1;
    if (baseUsers > 19) baseUsers = 19;
    if (baseUsers < 12) baseUsers = 12;
    const countEl = document.getElementById("onlineCount");
    if (countEl) countEl.innerText = baseUsers;
  }
  setInterval(updateOnlineUsers, 4000);

    /* ==========================================================================
     Restore Preferences on Page Load
     ========================================================================== */
  function restoreSavedPreferences() {
    // 1. Restore Theme
    const themeType = localStorage.getItem('talkstars_saved_theme_type');
    const card = document.getElementById("appScreen");

    if (themeType === 'preset') {
      const savedIndex = localStorage.getItem('talkstars_saved_theme_index');
      if (savedIndex !== null && backdrops[savedIndex] && card) {
        card.style.backgroundImage = `url('${backdrops[savedIndex]}')`;
      }
    } else if (themeType === 'custom') {
      const customBg = localStorage.getItem('talkstars_saved_custom_bg');
      if (customBg && card) {
        card.style.backgroundImage = `url('${customBg}')`;
      }
    }

    // 2. Restore Doodles Toggle
    const savedDoodles = localStorage.getItem('talkstars_doodles_active');
    if (savedDoodles === 'true') {
      toggleDoodles(true);
    }
  }

  // Initialize background data without blocking the timer
  window.addEventListener('DOMContentLoaded', () => {
    loadModalSnippet();
    restoreSavedName(); // 🌟 Restores previously saved name
    restoreSavedPreferences(); // 🌟 Restores theme and doodles toggle
  });

</script>
