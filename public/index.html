<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TalkStars ⭐ Master Stories & Earn Stars</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="bg-doodles" id="doodlesContainer"></div>

<main class="app-screen" id="appScreen">
  
   <!-- Navigation Header Bar -->
  <header class="app-nav">
    <div class="header-top-bar">
      <!-- Extreme Left: Live Pill (Under 20) -->
      <div class="online-pill">
        <span class="pulse-dot"></span>
        <span id="onlineCount">16</span> online
      </div>

      <!-- Extreme Right: Appealing Name Input + Theme Menu -->
      <div class="header-actions-group">
        <input 
          type="text" 
          id="kidNameInput" 
          class="name-input-appealing" 
          placeholder="✍️ Your Name..." 
          oninput="updatePersonalization()"
        />

        <div class="theme-menu-container">
          <button type="button" class="nav-pill-btn" onclick="toggleThemeMenu(event)">
            🎨 Theme ▾
          </button>

          <!-- Dropdown Menu List -->
          <div class="theme-list-dropdown" id="themeDropdown">
            <button class="theme-list-item" onclick="switchTheme(0)">🚀 Space Rocket Explorer</button>
            <button class="theme-list-item" onclick="switchTheme(1)">🌳 TalkStars Treehouse</button>
            <button class="theme-list-item" onclick="switchTheme(2)">🦖 Dino Volcano Jungle</button>
            <button class="theme-list-item" onclick="switchTheme(3)">🏎️ Cyber Racing Grid</button>
            <button class="theme-list-item" onclick="switchTheme(4)">⚽ Stadium Sports Arena</button>
            <button class="theme-list-item" onclick="switchTheme(5)">🦄 Unicorn Dreamland</button>
            <button class="theme-list-item" onclick="switchTheme(6)">🏰 Princess Fairy Garden</button>
            <button class="theme-list-item" onclick="switchTheme(7)">🍬 Candy Bubble Carnival</button>
            
            <div class="theme-list-divider"></div>
            
            <button class="theme-list-item" onclick="document.getElementById('customUploadInput').click()">
              📤 Upload Custom Photo...
            </button>
            <input type="file" id="customUploadInput" accept="image/*" style="display:none;" onchange="handleCustomUpload(event)">

            <div class="theme-list-divider"></div>
            
            <label class="doodle-menu-toggle-row">
              <span>✨ Floating Doodles</span>
              <input type="checkbox" id="doodleCheckbox" onchange="toggleDoodles(this.checked)">
            </label>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Hero Headings -->
  <section class="hero-header">
    <h1 class="main-title" id="mainTitle">TALK STARS</h1>
    <p class="subtitle" id="mainSubtitle">Tell Your Story & Earn 5 Stars! ⭐</p>
  </section>

  <!-- Polished, Prominent Age Group Pill -->
  <div class="age-select-wrap">
    <select id="ageGroup" class="styled-select-prominent">
      <option value="4-6 years old">🐣 Ages 4-6 • Junior Talkers</option>
      <option value="7-9 years old" selected>🦁 Ages 7-9 • Star Storytellers</option>
      <option value="10-12 years old">🚀 Ages 10-12 • Speech Champions</option>
      <option value="13-15 years old">🎓 Ages 13-15 • Master Orators</option>
    </select>
  </div>

  <!-- Primary Spotlight Topic Card -->
  <div class="prompt-card spotlight-card" id="promptCard">
    <p class="prompt-text spotlight-text" id="wordDisplay">Tap "Get My Topic" Below! 👇</p>
  </div>

  <!-- High-Focus Big Generate Trigger Button -->
  <button class="btn-generate btn-spotlight" id="genBtn" onclick="generateTopic()">
    🎲 Get My Topic!
  </button>

  <!-- Bonus Challenge Words -->
  <div class="bonus-card">
    <div class="bonus-title">✨ Bonus Challenge Words</div>
    <div class="bonus-chips" id="adjoiningDisplay">
      <span class="chip">Tap Button Above</span>
    </div>
  </div>

  <!-- Live Mic Bar -->
  <div class="recording-bar" id="recordingStatus">
    <span class="rec-pulse"></span> 🎙️ Mic Live • Speak loud and clear!
  </div>

  <!-- Bottom Timer & Player Dock -->
  <footer class="timer-dock">
    <select id="talkDuration" class="duration-select" onchange="changeDuration()">
      <option value="60" selected>⏱️ 1 Min</option>
      <option value="120">⏱️ 2 Min</option>
      <option value="180">⏱️ 3 Min</option>
    </select>

    <div class="clock-display" id="timer">01:00</div>

    <button class="btn-record-start" id="timerBtn" onclick="startChallenge()">Record 🎙️</button>
    <button class="btn-record-stop" id="finishBtn" onclick="finishTalk()" style="display:none;">Done 🏁</button>
  </footer>

</main>

<div id="modalContainer"></div>

<script>
  /* ==========================================================================
     1. Themes & Backdrop Engine
     ========================================================================== */
    /* ==========================================================================
     1. Themes & Backdrop Engine
     ========================================================================== */
  const backdrops = [
    // 1. Space Rocket Explorer (Boys Friendly)
    `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900"><defs><linearGradient id="g_space" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="%230f172a"/><stop offset="50%" stop-color="%231e1b4b"/><stop offset="100%" stop-color="%233b82f6"/></linearGradient></defs><rect width="600" height="900" fill="url(%23g_space)"/><polygon points="120,100 125,115 140,115 128,125 132,140 120,130 108,140 112,125 100,115 115,115" fill="%23facc15" opacity="0.85"/><polygon points="480,220 484,232 496,232 486,240 489,252 480,244 471,252 474,240 464,232 476,232" fill="%2338bdf8" opacity="0.9"/><circle cx="500" cy="650" r="50" fill="%23f97316" opacity="0.6"/><circle cx="120" cy="500" r="30" fill="%2306b6d4" opacity="0.5"/></svg>`,

    // 0. Default: TalkStars Treehouse
    "/images/treehouse-backdrop.png",

    // 2. Dino Volcano Jungle (Boys Friendly)
    `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900"><defs><linearGradient id="g_dino" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="%23ea580c"/><stop offset="50%" stop-color="%23ca8a04"/><stop offset="100%" stop-color="%2315803d"/></linearGradient></defs><rect width="600" height="900" fill="url(%23g_dino)"/><polygon points="300,350 480,750 120,750" fill="%23431407" opacity="0.6"/><path d="M0,750 Q150,680 300,750 T600,750 L600,900 L0,900 Z" fill="%23166534" opacity="0.75"/><circle cx="500" cy="150" r="60" fill="%23fef08a" opacity="0.45"/></svg>`,

    // 3. Cyber Racing Grid (Boys Friendly)
    `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900"><defs><linearGradient id="g_race" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="%2318181b"/><stop offset="50%" stop-color="%23312e81"/><stop offset="100%" stop-color="%2306b6d4"/></linearGradient></defs><rect width="600" height="900" fill="url(%23g_race)"/><line x1="50" y1="0" x2="250" y2="900" stroke="%2322d3ee" stroke-width="4" opacity="0.3"/><line x1="550" y1="0" x2="350" y2="900" stroke="%2322d3ee" stroke-width="4" opacity="0.3"/><line x1="0" y1="650" x2="600" y2="650" stroke="%23f43f5e" stroke-width="3" opacity="0.4"/><line x1="0" y1="750" x2="600" y2="750" stroke="%23f43f5e" stroke-width="5" opacity="0.4"/></svg>`,

    // 4. Stadium Sports Arena (Boys Friendly)
    `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900"><defs><linearGradient id="g_sport" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="%231e3a8a"/><stop offset="60%" stop-color="%230284c7"/><stop offset="100%" stop-color="%2316a34a"/></linearGradient></defs><rect width="600" height="900" fill="url(%23g_sport)"/><circle cx="100" cy="180" r="70" fill="%23ffffff" opacity="0.15"/><circle cx="500" cy="180" r="70" fill="%23ffffff" opacity="0.15"/><line x1="0" y1="720" x2="600" y2="720" stroke="%23ffffff" stroke-width="6" opacity="0.5"/><circle cx="300" cy="720" r="90" stroke="%23ffffff" stroke-width="6" fill="none" opacity="0.5"/></svg>`,

    // 5. Unicorn Dreamland
    `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900"><defs><linearGradient id="g_uni" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="%23ff9a9e"/><stop offset="50%" stop-color="%23fecfef"/><stop offset="100%" stop-color="%23a1c4fd"/></linearGradient></defs><rect width="600" height="900" fill="url(%23g_uni)"/><circle cx="500" cy="550" r="70" fill="%23ffffff" opacity="0.4"/><polygon points="150,120 156,138 175,138 160,150 165,168 150,156 135,168 140,150 125,138 144,138" fill="%23ffd166" opacity="0.85"/></svg>`,

    // 6. Princess Fairy Garden
    `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900"><defs><linearGradient id="g_prin" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="%23fad0c4"/><stop offset="50%" stop-color="%23ffd1ff"/><stop offset="100%" stop-color="%23c2e9fb"/></linearGradient></defs><rect width="600" height="900" fill="url(%23g_prin)"/><circle cx="140" cy="200" r="45" fill="%23ff85a2" opacity="0.4"/><circle cx="450" cy="350" r="55" fill="%23ff85a2" opacity="0.35"/><path d="M0,800 Q150,750 300,800 T600,800 L600,900 L0,900 Z" fill="%23bbf7d0" opacity="0.6"/></svg>`,

    // 7. Candy Bubble Carnival
    `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900"><defs><linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="%23ff9ff3"/><stop offset="50%" stop-color="%23feca57"/><stop offset="100%" stop-color="%23ff6b6b"/></linearGradient></defs><rect width="600" height="900" fill="url(%23g4)"/><circle cx="120" cy="180" r="50" fill="%23ffffff" opacity="0.4"/><circle cx="480" cy="280" r="65" fill="%23ffffff" opacity="0.35"/></svg>`
  ];


  function toggleThemeMenu(e) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }
    const dropdown = document.getElementById("themeDropdown");
    if (dropdown) dropdown.classList.toggle("show");
  }

  document.addEventListener("click", (e) => {
    const dropdown = document.getElementById("themeDropdown");
    if (dropdown && !dropdown.contains(e.target) && !e.target.closest(".theme-menu-container")) {
      dropdown.classList.remove("show");
    }
  });

  function switchTheme(index) {
    const card = document.getElementById("appScreen");
    if (card && backdrops[index]) {
      card.style.backgroundImage = `url('${backdrops[index]}')`;
    }
    document.getElementById("themeDropdown").classList.remove("show");
  }

  function handleCustomUpload(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const imageUrl = e.target.result;
      const card = document.getElementById("appScreen");
      if (card) card.style.backgroundImage = `url('${imageUrl}')`;
      document.getElementById("themeDropdown").classList.remove("show");
    };
    reader.readAsDataURL(file);
  }

  /* ==========================================================================
     2. Doodles Engine
     ========================================================================== */
  let doodlesActive = false;
  const doodleEmojis = ["⭐", "🚀", "🦄", "🐼", "🌈", "🍦", "🎈", "🫧"];

  function toggleDoodles(isEnabled) {
    doodlesActive = isEnabled;
    const container = document.getElementById("doodlesContainer");
    if (container) {
      container.style.display = doodlesActive ? "block" : "none";
      if (doodlesActive) renderDoodles();
    }
  }

  function renderDoodles() {
    const container = document.getElementById("doodlesContainer");
    if (!container) return;
    container.innerHTML = "";

    const totalDoodles = 8;
    for (let i = 0; i < totalDoodles; i++) {
      const emoji = doodleEmojis[i % doodleEmojis.length];
      const doodleEl = document.createElement("div");
      doodleEl.className = "doodle";
      doodleEl.innerText = emoji;

      const leftPos = (i * (100 / totalDoodles)) + (Math.random() * 4 - 2);
      const duration = (9 + Math.random() * 6).toFixed(1);
      const delay = (Math.random() * 4).toFixed(1);

      doodleEl.style.left = `${Math.max(3, Math.min(92, leftPos))}%`;
      doodleEl.style.animationDuration = `${duration}s`;
      doodleEl.style.animationDelay = `${delay}s`;

      container.appendChild(doodleEl);
    }
  }

  /* ==========================================================================
     3. Personalization & Setup
     ========================================================================== */
  function updatePersonalization() {
    const rawName = document.getElementById("kidNameInput")?.value.trim();
    const title = document.getElementById("mainTitle");
    const subtitle = document.getElementById("mainSubtitle");

    if (rawName) {
      title.innerText = `🌟 ${rawName.toUpperCase()}`;
      subtitle.innerText = `Master your story ${rawName}, hit record, and earn 5 stars!`;
    } else {
      title.innerText = "TALKSTARS";
      subtitle.innerText = "Tell Your Story & Earn 5 Stars! ⭐";
    }
  }

  async function loadModalSnippet() {
    try {
      const response = await fetch('/modal.html');
      const html = await response.text();
      document.getElementById('modalContainer').innerHTML = html;
    } catch (err) {}
  }

  /* ==========================================================================
     4. Topic Generator (Gemini API + Fallbacks)
     ========================================================================== */
  let currentExtraWords = [];
  const fallbackBank = {
    "4-6 years old": { main: "My Favorite Toy", extra: ["Play", "Share", "Fun"] },
    "7-9 years old": { main: "A Magical Treehouse", extra: ["Ladder", "Secret", "View"] },
    "10-12 years old": { main: "Design a New Video Game", extra: ["Hero", "Level", "Powers"] },
    "13-15 years old": { main: "The Ultimate Road Trip", extra: ["Playlist", "Map", "Adventure"] }
  };

  async function generateTopic() {
    const age = document.getElementById("ageGroup").value;
    const wordDisplay = document.getElementById("wordDisplay");
    const genBtn = document.getElementById("genBtn");

    wordDisplay.innerText = "✨ Finding a fun topic...";
    wordDisplay.classList.add("pulse-anim");
    genBtn.disabled = true;

    try {
      const response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ageGroup: age })
      });

      if (!response.ok) throw new Error(`Server status: ${response.status}`);
      const data = await response.json();
      renderResult(data.main, data.extra);
    } catch (err) {
      const fallback = fallbackBank[age];
      renderResult(fallback.main, fallback.extra);
    } finally {
      wordDisplay.classList.remove("pulse-anim");
      genBtn.disabled = false;
      resetTimer();
    }
  }

  function renderResult(mainWord, extraWords) {
    document.getElementById("wordDisplay").innerText = mainWord;
    currentExtraWords = extraWords || [];
    const adjoiningContainer = document.getElementById("adjoiningDisplay");
    adjoiningContainer.innerHTML = "";
    currentExtraWords.forEach(word => {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.innerText = word;
      adjoiningContainer.appendChild(chip);
    });
  }

  /* ==========================================================================
     5. Recorder & Timer Control
     ========================================================================== */
  let totalDuration = 60;
  let timeLeft = 60;
  let timerInterval = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let speechRecognizer = null;
  let speechTextAccumulator = "";
  let speechSecondsSpoken = 0;
  let audioStream = null;

  function changeDuration() {
    totalDuration = parseInt(document.getElementById("talkDuration").value, 10);
    resetTimer();
  }

  function updateTimerDisplay() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;
    document.getElementById("timer").innerText = 
      `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
  }

  async function startChallenge() {
    speechTextAccumulator = "";
    speechSecondsSpoken = 0;
    audioChunks = [];

    try {
      audioStream = await navigator.mediaDevices.getUserMedia({ 
        audio: { echoCancellation: true, noiseSuppression: true } 
      });

      const mimeTypes = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/aac'];
      const supportedMime = mimeTypes.find(type => MediaRecorder.isTypeSupported(type)) || '';
      
      mediaRecorder = supportedMime ? new MediaRecorder(audioStream, { mimeType: supportedMime }) : new MediaRecorder(audioStream);

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const mime = audioChunks[0]?.type || 'audio/mp4';
        const audioBlob = new Blob(audioChunks, { type: mime });
        const audioUrl = URL.createObjectURL(audioBlob);
        const player = document.getElementById("audioPlayback");
        if (player) {
          player.src = audioUrl;
          player.load();
        }
      };

      mediaRecorder.start(250);

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        try {
          speechRecognizer = new SpeechRecognition();
          speechRecognizer.continuous = true;
          speechRecognizer.interimResults = true;
          speechRecognizer.lang = 'en-US';

          speechRecognizer.onresult = (event) => {
            let fullCurrent = "";
            for (let i = 0; i < event.results.length; ++i) {
              fullCurrent += event.results[i][0].transcript + " ";
            }
            speechTextAccumulator = fullCurrent.trim();
          };

          speechRecognizer.start();
        } catch (e) {}
      }

      document.getElementById("recordingStatus").style.display = "flex";
      document.getElementById("timerBtn").style.display = "none";
      document.getElementById("finishBtn").style.display = "inline-block";
      document.getElementById("talkDuration").disabled = true;

      timerInterval = setInterval(() => {
        speechSecondsSpoken++;
        if (timeLeft > 0) {
          timeLeft--;
          updateTimerDisplay();
        } else {
          finishTalk();
        }
      }, 1000);

    } catch (err) {
      alert("Please allow microphone access to record your voice!");
    }
  }

  function finishTalk() {
    clearInterval(timerInterval);
    timerInterval = null;

    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
    if (audioStream) audioStream.getTracks().forEach(track => track.stop());
    if (speechRecognizer) {
      try { speechRecognizer.stop(); } catch (e) {}
    }

    document.getElementById("recordingStatus").style.display = "none";
    document.getElementById("timerBtn").style.display = "inline-block";
    document.getElementById("finishBtn").style.display = "none";
    document.getElementById("talkDuration").disabled = false;

    setTimeout(() => {
      evaluateSpeech();
      resetTimer();
    }, 400);
  }

  function evaluateSpeech() {
    const transcript = speechTextAccumulator.trim();
    const summaryBox = document.getElementById("summaryDisplay");
    const kidName = document.getElementById("kidNameInput")?.value.trim();
    const speakerLabel = kidName ? `${kidName}` : "Speaker";
    const topic = document.getElementById("wordDisplay")?.innerText || "Your Topic";

    let stars = "⭐⭐⭐";
    let feedback = `Good effort ${speakerLabel}! Keep talking to share more details!`;

    const words = transcript ? transcript.split(/\s+/).filter(w => w.length > 0) : [];
    const wordCount = words.length;

    if (speechSecondsSpoken >= 45 || wordCount >= 30) {
      stars = "⭐⭐⭐⭐⭐";
      feedback = `🏆 Outstanding job, ${speakerLabel}! You are a true TalkStar!`;
    } else if (speechSecondsSpoken >= 15 || wordCount >= 12) {
      stars = "⭐⭐⭐⭐";
      feedback = `🎉 Awesome talk, ${speakerLabel}! Great voice and pacing!`;
    }

    let bonusHitText = "Spoke with great confidence";
    if (transcript && currentExtraWords.length > 0) {
      const lower = transcript.toLowerCase();
      const hits = currentExtraWords.filter(w => lower.includes(w.toLowerCase()));
      if (hits.length > 0) {
        bonusHitText = `Included <strong>${hits.join(", ")}</strong>`;
      }
    }

    if (summaryBox) {
      summaryBox.innerHTML = `
        <div style="font-size: 0.88rem; line-height: 1.6;">
          • 🎯 <strong>Topic:</strong> ${topic}<br>
          • ⏱️ <strong>Speaking Time:</strong> ${speechSecondsSpoken}s recorded<br>
          • ⭐ <strong>Bonus Words:</strong> ${bonusHitText}<br>
          • 🎙️ <strong>Voice Playback:</strong> Ready to listen above!
        </div>
      `;
    }

    document.getElementById("starsDisplay").innerText = stars;
    document.getElementById("ratingFeedback").innerText = feedback;
    document.getElementById("resultModal").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("resultModal").style.display = "none";
    const audio = document.getElementById("audioPlayback");
    if (audio) {
      audio.pause();
      audio.currentTime = 0;
    }
  }

  function resetTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    timeLeft = totalDuration;
    updateTimerDisplay();
  }

  /* ==========================================================================
     6. Live Counter Simulation & Initialization
     ========================================================================== */
let baseUsers = 16;
  function updateOnlineUsers() {
    baseUsers += Math.floor(Math.random() * 3) - 1;
    if (baseUsers > 19) baseUsers = 19;
    if (baseUsers < 12) baseUsers = 12;
    const countEl = document.getElementById("onlineCount");
    if (countEl) countEl.innerText = baseUsers;
  }
  setInterval(updateOnlineUsers, 4000);

  window.addEventListener('DOMContentLoaded', () => {
    loadModalSnippet();
  });
</script>

</body>
</html>
