<!-- Evaluation Modal Sheet Partial -->
<div class="modal-overlay" id="resultModal">
  <div class="modal-sheet">
    <h2>🎉 Fantastic Speech!</h2>
    
    <div class="stars-row" id="starsDisplay">⭐⭐⭐</div>
    <div class="feedback-badge" id="ratingFeedback">Good Effort!</div>

    <audio id="audioPlayback" controls playsinline></audio>

    <!-- Download Button -->
    <button 
      type="button" 
      id="downloadBtn" 
      onclick="downloadRecording()" 
      style="margin: 8px 0; padding: 8px 14px; background: #22c55e; color: #fff; border: none; border-radius: 20px; font-weight: bold; cursor: pointer;">
      ⬇️ Download Recording
    </button>

    <div style="text-align: left; font-size: 0.85rem; font-weight: 700; color: #62728f; margin-bottom: 2px;">
      📋 Speech Summary & Highlights:
    </div>
    <div class="summary-card-inner" id="summaryDisplay">No speech detected.</div>

    <button class="btn-modal-close" onclick="closeModal()">Try Another Topic 🔄</button>
  </div>
</div>
