<!-- Evaluation Modal Sheet Partial -->
<div class="modal-overlay" id="resultModal">
  <div class="modal-sheet">
    <div class="modal-header-block">
      <h2>🎉 Fantastic Speech!</h2>
      <div class="stars-row" id="starsDisplay">⭐⭐⭐</div>
      <div class="feedback-badge" id="ratingFeedback">Good Effort!</div>
    </div>

    <!-- Compact Action Bar (Playback + Icon Actions) -->
<div class="modal-actions-row">
  <audio id="audioPlayback" controls class="modal-audio-player"></audio>
  
  <div class="icon-actions-group">
    <!-- Download Audio Icon Button -->
    <button 
      type="button" 
      class="icon-action-btn" 
      id="downloadBtn" 
      title="Download Audio" 
      onclick="downloadRecording()"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
    </button>

    <!-- Share Audio Icon Button -->
    <button 
      type="button" 
      class="icon-action-btn" 
      id="shareBtn" 
      title="Share Recording" 
      onclick="shareRecording()"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"></circle>
        <circle cx="6" cy="12" r="3"></circle>
        <circle cx="18" cy="19" r="3"></circle>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
      </svg>
    </button>
  </div>
</div>


    <!-- Detailed Speech Highlights -->
    <div style="text-align: left; font-size: 0.82rem; font-weight: 800; color: #a29bfe; margin-bottom: -4px;">
      📋 Speech Summary & Highlights:
    </div>
    <div class="summary-card-inner" id="summaryDisplay">
      <!-- Injected by JavaScript -->
    </div>

    <!-- Dark Frosted Feedback Reaction Bar -->
    <div class="topic-feedback-section" id="feedbackSection">
      <div class="feedback-header-row">
        <span class="feedback-label">How was this topic?</span>
        <span id="feedbackThanks" class="feedback-thanks-msg" style="display:none;">✨ Thanks!</span>
      </div>

      <div class="feedback-reactions-grid">
        <button type="button" class="reaction-pill reaction-easy" onclick="submitTopicFeedback('Easy 😄', this)">
          <span class="reaction-emoji">😄</span>
          <span class="reaction-text">Easy</span>
        </button>
        <button type="button" class="reaction-pill reaction-fun" onclick="submitTopicFeedback('Loved It ⭐', this)">
          <span class="reaction-emoji">⭐</span>
          <span class="reaction-text">Fun</span>
        </button>
        <button type="button" class="reaction-pill reaction-tough" onclick="submitTopicFeedback('Tough 🤯', this)">
          <span class="reaction-emoji">🤯</span>
          <span class="reaction-text">Tough</span>
        </button>
        <button type="button" class="reaction-pill reaction-weird" onclick="submitTopicFeedback('Irrelevant 🤔', this)">
          <span class="reaction-emoji">🤔</span>
          <span class="reaction-text">Weird</span>
        </button>
      </div>
    </div>

    <button class="btn-modal-close" onclick="closeModal()">Try Another Topic 🔄</button>
  </div>
</div>
