<!-- Evaluation Modal Popup Partial -->
<div class="modal-overlay" id="resultModal">
  <div class="modal-card">
    <h2>🎉 Fantastic Speech!</h2>
    
    <div class="stars-box" id="starsDisplay">⭐⭐⭐</div>
    <div class="rating-feedback" id="ratingFeedback">Good Effort!</div>

    <audio id="audioPlayback" controls playsinline></audio>

    <div style="text-align: left; font-size: 0.85rem; font-weight: bold; margin-bottom: 4px;">
      📋 Speech Summary & Highlights:
    </div>
    <div class="transcript-box" id="summaryDisplay">No speech detected.</div>

    <button class="btn btn-close" onclick="closeModal()">Play Again 🔄</button>
  </div>
</div>
